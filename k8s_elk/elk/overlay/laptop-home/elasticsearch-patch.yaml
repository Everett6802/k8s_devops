apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
spec:
  template:
    spec:
      containers:
        - name: elasticsearch
          env:
            - name: ES_JAVA_OPTS
              value: "-Xms768m -Xmx768m"
            - name: node.processors
              value: "1"
          resources:
            requests:
              memory: "1200Mi"
              cpu: "400m"
            limits:
              memory: "1500Mi"
              cpu: "1"
