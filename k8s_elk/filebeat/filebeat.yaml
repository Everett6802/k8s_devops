apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: filestream
      id: container-logs
      paths:
        - /var/log/containers/*.log
      parsers:
        - container: ~
      prospector.scanner.symlinks: true

    output.elasticsearch:
      hosts: ["http://elasticsearch:9200"]

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
    spec:
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.12.0
        securityContext:
          runAsUser: 0   # ⭐ 很重要（讀 host logs）
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers   # ⭐ 新增
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: config
          mountPath: /usr/share/filebeat/filebeat.yml
          subPath: filebeat.yml

      volumes:
      - name: varlog
        hostPath:
          path: /var/log

      - name: varlibdockercontainers   # ⭐ 新增
        hostPath:
          path: /var/lib/docker/containers

      - name: config
        configMap:
          name: filebeat-config